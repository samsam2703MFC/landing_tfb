  /api/admin/modules/{id}/screenshots:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Admin — Contenu]
      summary: Les captures d'un module
      operationId: listScreenshots
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/modules/[id]/screenshots/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Les captures, par `sortOrder`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  screenshots:
                    type: array
                    items: { $ref: '#/components/schemas/Screenshot' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Admin — Contenu]
      summary: Téléverse des captures
      description: |
        **Le seul moyen correct d'ajouter une capture** : cet appel écrit le
        fichier dans `STORAGE_PATH` **et** crée la ligne, ensemble. Créer la ligne
        autrement laisse un chemin qui ne pointe sur rien, et le carrousel retombe
        sur son placeholder sans qu'aucune erreur ne soit levée.

        Types acceptés : PNG, JPEG, WebP, SVG. 4 Mo maximum par fichier.

        Un fichier refusé n'annule pas ceux déjà stockés : la réponse `422` liste
        dans `created` ce qui est passé avant l'erreur.
      operationId: uploadScreenshots
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/modules/[id]/screenshots/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
            encoding:
              files:
                contentType: image/png, image/jpeg, image/webp, image/svg+xml
      responses:
        '201':
          description: Captures créées.
          content:
            application/json:
              schema:
                type: object
                properties:
                  screenshots:
                    type: array
                    items: { $ref: '#/components/schemas/Screenshot' }
        '400':
          description: Requête non multipart, ou aucun fichier reçu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Un fichier a été refusé — type ou taille. Les précédents sont conservés.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  created:
                    type: array
                    items: { $ref: '#/components/schemas/Screenshot' }
    put:
      tags: [Admin — Contenu]
      summary: Réordonne le carrousel
      description: Portée au module — on ne peut pas réordonner le carrousel d'un autre.
      operationId: reorderScreenshots
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/modules/[id]/screenshots/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderRequest' }
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

