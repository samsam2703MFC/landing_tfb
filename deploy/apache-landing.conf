# Monte la landing sous __BASE__/ sur ce serveur Apache.
#
# Ce fichier est un gabarit : le workflow de déploiement remplace __BASE__ et
# __PORT__ puis l'installe dans /etc/apache2/conf-available/landing-tfb.conf,
# activé par a2enconf. Ne pas l'éditer sur le serveur, il serait écrasé.
#
# Déposé en conf-available plutôt qu'en vhost : la landing s'ajoute ainsi aux
# hôtes déjà servis — dont le catch-all sur l'adresse IP — sans toucher à
# aucun de leurs fichiers de configuration.

<IfModule mod_proxy.c>
    ProxyPreserveHost On

    # Le chemin est conservé des deux côtés : Astro est construit avec ce même
    # préfixe et attend donc de le retrouver dans les URL qu'il reçoit.
    ProxyPass        __BASE__ http://127.0.0.1:__PORT____BASE__
    ProxyPassReverse __BASE__ http://127.0.0.1:__PORT____BASE__
</IfModule>
