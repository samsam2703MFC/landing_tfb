name: CI

on:
  pull_request:
  push:
    branches: [main]

# Le déploiement dépend de ce workflow, donc il doit rester rapide et strict.
jobs:
  check:
    name: typecheck · lint · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Le client Prisma est généré à partir du schéma ; sans lui, tsc échoue
      # sur chaque import de @prisma/client.
      - run: npx prisma generate

      - run: npm run typecheck
      - run: npm run lint

      # Le build ne touche pas la base — aucun DATABASE_URL n'est nécessaire ici,
      # et c'est une propriété qu'on veut garder : si ce job se met à réclamer une
      # base, c'est qu'une page s'est mise à faire du prerender.
      - run: npm run build
        env:
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci
          ADMIN_SESSION_SECRET: ci-secret-32-characters-minimum-ok

      # Le contrat prétend décrire ce qui existe. Sans ce contrôle il se met à
      # décrire ce qui existait, ce qui est pire que pas de contrat : on le croit.
      - name: Contrôler docs/openapi.yaml
        run: |
          python3 - <<'PY'
          import os, re, sys, yaml
          spec = yaml.safe_load(open('docs/openapi.yaml'))
          text = open('docs/openapi.yaml').read()

          broken = []
          for ref in set(re.findall(r"'#/([^']+)'", text)):
              node = spec
              for part in ref.split('/'):
                  if isinstance(node, dict) and part in node:
                      node = node[part]
                  else:
                      broken.append(ref)
                      break
          missing = sorted({s for s in re.findall(r'x-tfb-source:\s*(\S+)', text) if not os.path.exists(s)})

          if broken:
              print('Références cassées :', ', '.join(sorted(broken)))
          if missing:
              print('x-tfb-source introuvable :', ', '.join(missing))
          if broken or missing:
              sys.exit(1)

          ops = sum(1 for p in spec['paths'].values() for m in p
                    if m in ('get', 'post', 'put', 'patch', 'delete'))
          print(f'OpenAPI : {len(spec["paths"])} chemins, {ops} opérations')
          PY
