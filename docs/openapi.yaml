  /api/admin/subscriptions:
    get:
      tags: [Admin — Facturation]
      summary: Les abonnements
      description: >-
        Lecture seule. Stripe possède cette donnée : le webhook l'écrit, la console
        la lit.
      operationId: listSubscriptions
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/subscriptions/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Les abonnements, du plus récent au plus ancien.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
