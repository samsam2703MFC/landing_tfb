# Pile de production : Directus (CMS), la landing Astro, Caddy en frontal.
#
# La base de données n'est PAS gérée ici : on se branche sur le SQL existant
# (PostgreSQL ou MySQL selon DB_CLIENT).
#
# Les variables viennent du fichier .env placé à côté de ce compose.
# Le mapping DB_LOGIN → DB_USER, DB_NAME → DB_DATABASE, DB_PASS → DB_PASSWORD
# permet de conserver tels quels les noms de secrets déjà en place sur le dépôt.

name: landing-tfb

services:
  directus:
    image: directus/directus:11
    restart: unless-stopped
    environment:
      # --- Connexion à la base existante ---
      DB_CLIENT: ${DB_CLIENT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_LOGIN}
      DB_DATABASE: ${DB_NAME}
      DB_PASSWORD: ${DB_PASS}
      # --- Clés internes (stables, sinon les sessions sautent) ---
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      # --- Compte admin créé au premier démarrage ---
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      # --- Exposition ---
      PUBLIC_URL: https://${CMS_DOMAIN}
      CORS_ENABLED: "false"
      TELEMETRY: "false"
      WEBSOCKETS_ENABLED: "false"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    extra_hosts:
      # Permet d'atteindre une base installée sur l'hôte (DB_HOST=host.docker.internal).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8055/server/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build:
      context: ../apps/web
      args:
        SITE_DOMAIN: ${SITE_DOMAIN}
    restart: unless-stopped
    environment:
      # La landing parle à Directus sur le réseau interne : le jeton ne sort
      # jamais du serveur, et aucun appel n'est fait depuis le navigateur.
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN}
      SITE_DOMAIN: ${SITE_DOMAIN}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-60000}
      HOST: 0.0.0.0
      PORT: 4321
    depends_on:
      directus:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      CMS_DOMAIN: ${CMS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - directus

volumes:
  directus_uploads:
  directus_extensions:
  caddy_data:
  caddy_config:
