          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingActionResult' }

  # ------------------------------------------------------- packs & licences --

  /api/admin/packs:
    get:
      tags: [Admin — Packs & licences]
      summary: Les packs, leurs prix, leur composition
      operationId: listPacks
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/packs/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Les packs, et si les licences comptées viennent des fixtures.
          content:
            application/json:
              schema:
                type: object
                properties:
                  packs:
                    type: array
                    items: { $ref: '#/components/schemas/PackView' }
                  fixture: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Admin — Packs & licences]
      summary: Crée un pack
      description: >-
        Créé **inactif et sans module** : un pack qui ouvrirait quelque chose dès
        sa création serait un pack que personne n'a relu.


        `key` doit être identique au `code` du package côté service de
        facturation — c'est la seule jointure entre une licence et les modules
        qu'elle ouvre.
      operationId: createPack
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/packs/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, maxLength: 80, pattern: '^[a-z0-9][a-z0-9_-]*$' }
                stripeProductId: { type: [string, 'null'], maxLength: 120 }
                kind: { $ref: '#/components/schemas/PackKind' }
                icon: { type: string, maxLength: 60 }
                sortOrder: { type: integer, default: 0 }
      responses:
        '201':
          description: Pack créé, inactif.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pack: { $ref: '#/components/schemas/Pack' }
        '400':
          description: Clé invalide, clé déjà prise, ou produit Stripe déjà rattaché ailleurs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/packs/sync-stripe:
    post:
      tags: [Admin — Packs & licences]
      summary: Rafraîchit les prix depuis Stripe
      description: >-
        Met à jour les prix des packs déjà rattachés à un produit Stripe. **Ne
        touche jamais la composition** : Stripe dit ce qui est payé, les modules
        que ça ouvre sont à nous, et aucune lecture externe ne les réécrit.


        Répond `200 { status: "stub" }` tant que Stripe n'est pas configuré, comme
        `/api/checkout`, pour que la console dise pourquoi au lieu de laisser
        croire qu'une synchronisation a eu lieu.
      operationId: syncPacksFromStripe
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/packs/sync-stripe/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Synchronisation effectuée, ou bouchonnée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, stub] }
                  reason: { type: string }
                  packs: { type: integer }
                  prices: { type: integer }
                  orphans:
                    type: array
                    description: Packs dont le produit Stripe est introuvable. Signalés, jamais désactivés d'office.
                    items: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/packs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Admin — Packs & licences]
      summary: Un pack, avec le catalogue de modules pour le composer
      operationId: getPack
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/packs/[id]/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Le pack et le catalogue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pack:
                    allOf:
                      - $ref: '#/components/schemas/Pack'
                      - type: object
                        properties:
                          prices:
                            type: array
                            items: { $ref: '#/components/schemas/PackPrice' }
                          moduleIds:
                            type: array
                            items: { type: integer }
                  catalogue:
                    type: array
                    items: { $ref: '#/components/schemas/ModuleLabel' }
                  licenseCount: { type: integer }
                  fixture: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin — Packs & licences]
      summary: Modifie un pack
      description: >-
        `key` est absente du corps : c'est ce sur quoi le code de package d'une
        licence s'aligne, donc la renommer détacherait silencieusement chaque
        licence de ses modules.


        Activer un pack exige un produit Stripe et au moins un prix — sauf pour un
        pack `free`, qui ne facture rien. Sinon la landing afficherait une offre
        que personne ne peut souscrire.
      operationId: updatePack
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/packs/[id]/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stripeProductId: { type: [string, 'null'] }
                kind: { $ref: '#/components/schemas/PackKind' }
                icon: { type: [string, 'null'] }
                isActive: { type: boolean }
                isFeatured: { type: boolean }
                sortOrder: { type: integer }
      responses:
        '200':
          description: Pack modifié.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pack: { $ref: '#/components/schemas/Pack' }
        '400':
          description: Produit déjà rattaché, ou activation sans produit ni prix.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin — Packs & licences]
      summary: Supprime un pack
      description: >-
        Refusé tant que le service de facturation rapporte des licences sur cette
        clé : chaque magasin concerné perdrait ses modules sans qu'il reste rien
        pour l'expliquer.
      operationId: deletePack
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/packs/[id]/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          description: Des licences utilisent ce pack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/packs/{id}/modules:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Admin — Packs & licences]
      summary: La composition du pack
      description: >-
        La liste complète, appliquée en une transaction — une composition écrite à
        moitié ouvrirait un ensemble de modules que personne n'a choisi.


        C'est le modèle d'autorisation, et il vit ici plutôt que dans les
        métadonnées Stripe : un modèle d'autorisation éditable depuis un champ
        texte de tableau de bord n'est pas un modèle d'autorisation.


        Un seul identifiant inconnu fait échouer tout l'appel, au lieu de composer
        le pack avec le sous-ensemble qui existait.
      operationId: setPackModules
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/packs/[id]/modules/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [moduleIds]
              properties:
                moduleIds:
                  type: array
                  items: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Composition enregistrée, avec la portée du changement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  moduleIds:
                    type: array
                    items: { type: integer }
                  added: { type: integer }
                  removed: { type: integer }
                  licenseCount:
                    type: integer
                    description: Licences touchées. Fermer un module masque l'écran et bloque ses endpoints, sans rien supprimer.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/packs/{id}/prices:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Admin — Packs & licences]
      summary: Les variantes de facturation du pack
      description: >-
        Mensuel, annuel et paiement unique sont trois prix d'un même produit
        Stripe, pas trois packs. La liste remplace ce qui est stocké.


        Un prix Stripe appartient à un seul produit, donc à un seul pack :
        revendiquer le prix d'un autre pack ferait diverger les deux sur ce qu'un
        paiement a acheté.
      operationId: setPackPrices
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/packs/[id]/prices/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prices]
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    required: [stripePriceId, interval]
                    properties:
                      stripePriceId: { type: string, maxLength: 120 }
                      amount: { type: [integer, 'null'], description: En centimes. `null` = sur devis. }
                      currency: { type: string, default: EUR }
                      interval: { type: string, enum: [month, year, one_time] }
                      isDefault: { type: boolean }
      responses:
        '200':
          description: Les prix enregistrés.
          content:
            application/json:
              schema:
                type: object
                properties:
                  prices:
                    type: array
                    items: { $ref: '#/components/schemas/PackPrice' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/licenses/{licenseId}/modules:
    parameters:
      - $ref: '#/components/parameters/LicenseId'
    get:
      tags: [Admin — Packs & licences]
      summary: Ce que cette licence ouvre réellement
      description: >-
        La résolution pour laquelle toute la chaîne existe : la composition du
        pack, puis le statut de licence que Stripe possède, puis les dérogations
        qu'un humain a écrites. Chaque module revient avec la raison pour laquelle
        il est ouvert ou fermé.


        Seuls `active` et `trialing` ouvrent quoi que ce soit. `past_due` ferme —
        il n'y a pas de délai de grâce, et en ajouter un est une décision produit
        qui appartient à `OPEN_STATUSES`, pas aux appelants.
      operationId: getLicenseModules
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/licenses/[licenseId]/modules/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: La licence et sa résolution.
          content:
            application/json:
              schema:
                type: object
                properties:
                  license: { type: object, additionalProperties: true }
                  packKey: { type: string }
                  packFound:
                    type: boolean
                    description: '`false` quand aucun pack ne porte cette clé — la licence n''ouvre alors rien, et le dire est le seul moyen de distinguer ce cas d''un pack vide.'
                  modules:
                    type: array
                    items: { $ref: '#/components/schemas/ResolvedModule' }
                  fixture: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/licenses/{licenseId}/overrides:
    parameters:
      - $ref: '#/components/parameters/LicenseId'
    get:
      tags: [Admin — Packs & licences]
      summary: Les dérogations d'une licence, en cours et révoquées
      operationId: listOverrides
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/licenses/[licenseId]/overrides/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Les dérogations, de la plus récente à la plus ancienne.
          content:
            application/json:
              schema:
                type: object
                properties:
                  overrides:
                    type: array
                    items: { $ref: '#/components/schemas/LicenseOverride' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Admin — Packs & licences]
      summary: Pose une dérogation
      description: >-
        Ouvre ou ferme un module hors pack, pour cette licence. C'est le seul
        endroit de la chaîne qu'une décision humaine peut surcharger, et le
        webhook Stripe ne l'écrase pas.


        `reason` est obligatoire : une dérogation sans motif est intraçable six
        mois plus tard.


        Une dérogation existante sur le même module est révoquée et remplacée —
        l'ancienne ligne reste, avec sa date et son auteur.
      operationId: createOverride
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/licenses/[licenseId]/overrides/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [moduleId, grant, reason]
              properties:
                moduleId: { type: integer, minimum: 1 }
                grant:
                  type: boolean
                  description: '`true` ouvre le module malgré le pack, `false` le ferme malgré le pack.'
                reason: { type: string }
                expiresAt:
                  type: [string, 'null']
                  format: date-time
                  description: Doit être dans le futur. Absente, la dérogation tient jusqu'à sa révocation.
      responses:
        '201':
          description: Dérogation posée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  override: { $ref: '#/components/schemas/LicenseOverride' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Licence ou module introuvable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/licenses/{licenseId}/overrides/{overrideId}:
    parameters:
      - $ref: '#/components/parameters/LicenseId'
      - name: overrideId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      tags: [Admin — Packs & licences]
      summary: Révoque une dérogation
      description: >-
        Révoquée, pas supprimée : la ligne reste avec sa date et son auteur, et la
        licence retombe sur ce que dit son pack. Une dérogation effaçable
        laisserait un changement d'accès sans rien derrière pour l'expliquer.
      operationId: revokeOverride
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/licenses/[licenseId]/overrides/[overrideId]/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Dérogation révoquée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  override: { $ref: '#/components/schemas/LicenseOverride' }
        '400':
          description: Identifiant invalide, ou dérogation déjà révoquée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # -------------------------------------------------------------- commercial --

  /api/admin/agents:
    get:
      tags: [Admin — Commercial]
      summary: Les agents, leurs clients et ce qui est calculable
      description: >-
        `totalCents` n'additionne que les factures encaissées. Une facture émise
        et non payée n'y figure pas — une commission sur de l'argent que personne
        n'a reçu est une dette envers l'agent.
      operationId: listAgents
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/agents/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Les agents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: '#/components/schemas/AgentRow' }
                  fixture:
                    type: boolean
                    description: >-
                      `true` quand les factures viennent des fixtures. Aucun
                      montant ne peut alors être arrêté.
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Admin — Commercial]
      summary: Crée un agent
      description: >-
        Créé sans client et sans plan. Le plan se rattache à l'attribution, pas à
        l'agent : le même agent peut être sur deux deals différents.
      operationId: createAgent
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/agents/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string }
                email: { type: string, format: email, description: Unique — c'est l'identifiant de l'agent. }
                kind: { type: string, enum: [commercial, technique], default: commercial }
      responses:
        '201':
          description: Agent créé.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { $ref: '#/components/schemas/Agent' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/agents/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Admin — Commercial]
      summary: Un agent, ses attributions, ses commissions ligne par ligne
      description: |
        Une ligne par facture, avec la raison quand rien n'est calculé. `amount`
        vaut `null`, jamais `0` : zéro se lit comme une décision, et il s'agit
        d'une omission.

        `settleable` est `false` tant que les factures ne viennent pas du service
        de facturation. Arrêter une commission sur des chiffres inventés, c'est
        payer quelqu'un sur une facture que personne n'a émise.
      operationId: getAgent
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/agents/[id]/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: La fiche de l'agent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentDetail' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin — Commercial]
      summary: Modifie un agent
      operationId: updateAgent
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/agents/[id]/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                kind: { type: string, enum: [commercial, technique] }
                isActive: { type: boolean }
      responses:
        '200':
          description: Agent modifié.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { $ref: '#/components/schemas/Agent' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin — Commercial]
      summary: Supprime un agent sans aucune attribution
      description: >-
        Refusé dès qu'une attribution existe : la suppression les emporterait, et
        avec elles le seul document expliquant les commissions versées.
        Désactivez l'agent à la place.
      operationId: deleteAgent
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/agents/[id]/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          description: Des attributions sont rattachées à cet agent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/agents/{id}/assignments:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin — Commercial]
      summary: Attribue un client à un agent
      description: >-
        Si un autre agent détient déjà ce client, son attribution est close à
        `startedAt` dans la même transaction : deux attributions ouvertes
        paieraient deux agents sur la même facture. `startedAt` décide de
        l'ancienneté, donc du palier, pour des années — il vaut par défaut la
        date du jour et s'antidate délibérément.
      operationId: assignClient
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/agents/[id]/assignments/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantSlug]
              properties:
                tenantSlug: { type: string, description: Le slug du tenant côté service de facturation. }
                packKey: { type: [string, 'null'], description: Restreint l'attribution à un pack. `null` couvre tout. }
                planId: { type: [integer, 'null'] }
                startedAt: { type: string, format: date-time }
                note: { type: string, maxLength: 255 }
      responses:
        '201':
          description: Attribution créée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignment: { $ref: '#/components/schemas/AgentAssignment' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/agents/{id}/assignments/{assignmentId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: assignmentId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      tags: [Admin — Commercial]
      summary: Modifie ou clôt une attribution
      description: >-
        Changer le plan change les calculs **à venir**. Les commissions déjà
        arrêtées gardent le taux appliqué : c'est pourquoi l'arrêté capture le
        montant au lieu de le recalculer depuis le plan du jour.
      operationId: updateAssignment
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/agents/[id]/assignments/[assignmentId]/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planId: { type: [integer, 'null'] }
                packKey: { type: [string, 'null'] }
                endedAt: { type: [string, 'null'], format: date-time }
                note: { type: [string, 'null'], maxLength: 255 }
      responses:
        '200':
          description: Attribution modifiée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignment: { $ref: '#/components/schemas/AgentAssignment' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin — Commercial]
      summary: Supprime une attribution
      description: >-
        Une attribution qui a tourné se clôt avec `endedAt`, elle ne se supprime
        pas : c'est le seul document expliquant pourquoi un agent a été payé.
      operationId: deleteAssignment
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/agents/[id]/assignments/[assignmentId]/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/commission-plans:
    get:
      tags: [Admin — Commercial]
      summary: Les plans de commission et leurs paliers
      description: >-
        `coversMonthZero` signale un plan dont l'échelle démarre après le mois 0 :
        il ne calcule rien pour un client neuf, et le fait sans bruit.
      operationId: listCommissionPlans
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/commission-plans/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Les plans.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items: { $ref: '#/components/schemas/CommissionPlan' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Admin — Commercial]
      summary: Crée un plan et ses paliers
      description: >-
        Les taux sont en points de base — `9000` = 90,00 % — et jamais en
        flottants. Deux paliers au même mois sont refusés : l'échelle dépendrait
        de l'ordre des lignes.
      operationId: createCommissionPlan
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/commission-plans/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, pattern: '^[a-z0-9][a-z0-9_-]*$' }
                label: { type: string }
                tiers:
                  type: array
                  items: { $ref: '#/components/schemas/CommissionTier' }
      responses:
        '201':
          description: Plan créé.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan: { $ref: '#/components/schemas/CommissionPlan' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/commission-plans/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Admin — Commercial]
      summary: Modifie un plan, ou remplace ses paliers
      description: >-
        Fourni, `tiers` remplace l'échelle entière : un plan se lit d'un bloc, et
        une modification à moitié appliquée est un taux que personne n'a
        négocié.
      operationId: updateCommissionPlan
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/commission-plans/[id]/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                isActive: { type: boolean }
                tiers:
                  type: array
                  items: { $ref: '#/components/schemas/CommissionTier' }
      responses:
        '200':
          description: Plan modifié.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan: { $ref: '#/components/schemas/CommissionPlan' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin — Commercial]
      summary: Supprime un plan qu'aucune attribution n'utilise
      description: >-
        La clé étrangère est `ON DELETE SET NULL` : la suppression ne échouerait
        pas, elle laisserait ces attributions sans plan et cesserait de payer
        leurs agents. Désactivez le plan à la place.
      operationId: deleteCommissionPlan
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/commission-plans/[id]/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          description: Des attributions utilisent ce plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/commercial/settings:
    get:
      tags: [Admin — Commercial]
      summary: Étapes du cycle, prestations, sociétés de facturation
      description: >-
        Les trois listes sont derrière un seul point d'entrée parce qu'elles se
        lisent ensemble : une liste d'étapes sans ses prestations est une
        configuration à moitié faite. Les offres ne sont pas ici — une offre est
        un pack.
      operationId: getCommercialSettings
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/commercial/settings/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Les trois listes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialSettings' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Admin — Commercial]
      summary: Ajoute une entrée dans l'une des trois listes
      operationId: createCommercialSetting
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/commercial/settings/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection, key, label]
              properties:
                collection: { $ref: '#/components/schemas/CommercialCollection' }
                key: { type: string, pattern: '^[a-z0-9][a-z0-9_-]*$' }
                label: { type: string, description: Le nom de la société pour `billing-entities`. }
                amount:
                  type: [integer, 'null']
                  description: '`services` uniquement, en centimes. `null` = sur devis, ce qui n''est pas gratuit.'
                currency: { type: string, default: EUR }
                vatNumber: { type: [string, 'null'] }
                address: { type: [string, 'null'] }
                sortOrder: { type: integer, default: 0 }
                isDefault: { type: boolean, description: '`billing-entities` uniquement. Une seule à la fois.' }
      responses:
        '201':
          description: Entrée créée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry: { type: object, additionalProperties: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/commercial/settings/{collection}/{id}:
    parameters:
      - name: collection
        in: path
        required: true
        schema: { $ref: '#/components/schemas/CommercialCollection' }
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Admin — Commercial]
      summary: Modifie une entrée
      description: >-
        Désactiver plutôt que supprimer : une étape ou une prestation qui
        disparaît emporte la lecture des deals passés.
      operationId: updateCommercialSetting
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/commercial/settings/[collection]/[id]/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                name: { type: string }
                amount: { type: [integer, 'null'] }
                currency: { type: string }
                vatNumber: { type: [string, 'null'] }
                address: { type: [string, 'null'] }
                sortOrder: { type: integer }
                isActive: { type: boolean }
                isDefault: { type: boolean }
      responses:
        '200':
          description: Entrée modifiée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry: { type: object, additionalProperties: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin — Commercial]
      summary: Supprime une entrée
      description: >-
        Possible aujourd'hui parce que rien ne référence encore ces listes. Dès
        qu'une offre portera une étape ou une prestation, cette route devra
        refuser sur un compteur de références, comme le font déjà les packs et
        les plans. La société par défaut est déjà refusée.
      operationId: deleteCommercialSetting
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/commercial/settings/[collection]/[id]/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------- connecteurs --

  /api/admin/connectors:
    get:
      tags: [Admin — Système]
      summary: Chaque dépendance externe, son état réel, et ce qui casse sans elle
      description: |
        Quatre états, et la distinction entre les deux premiers est tout l'intérêt
        de la route :

        - `unconfigured` — aucune configuration. Une **décision**, pas une panne.
        - `down` — configuré et ne répond pas. Un **accident**.
        - `degraded` — répond, mais une pièce manque. Le cas le plus discret :
          Stripe avec une clé secrète et sans secret de webhook lit tout
          correctement et n'enregistre aucun paiement.
        - `ok` — répond, et tout ce dont il a besoin est présent.

        Les sondes sont en lecture seule et sans effet de bord, et leur résultat
        est mis en cache 30 secondes. **Aucun secret ne franchit cette frontière** :
        les valeurs renvoyées sont des empreintes masquées et des compteurs.
      operationId: listConnectors
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/connectors/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Les connecteurs et le décompte par état.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectors:
                    type: array
                    items: { $ref: '#/components/schemas/ConnectorState' }
                  counts:
                    type: object
                    properties:
                      ok: { type: integer }
                      degraded: { type: integer }
                      down: { type: integer }
                      unconfigured: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/connectors/{key}/test:
    parameters:
      - name: key
        in: path
        required: true
        description: La clé du connecteur au registre (`src/lib/connectors/registry.ts`).
        schema:
          type: string
          enum: [database, sessions, storage, billing, stripe, tenant-keys]
    post:
      tags: [Admin — Système]
      summary: Relance la sonde d'un connecteur, sans cache
      description: >-
        `POST` et non `GET` : l'appel contourne le cache et écrit une ligne
        d'historique, il n'est donc pas sûr à préfetcher et un navigateur ne doit
        pas le déclencher au survol. La sonde elle-même reste sans effet de bord
        sur le connecteur — lire un compte Stripe, compter une table, se faire
        refuser une clé volontairement invalide. Seuls les tests demandés sont
        journalisés : enregistrer chaque rendu de page enterrerait les tests sous
        du bruit.
      operationId: testConnector
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/connectors/[key]/test/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Le connecteur après sondage, et son historique.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connector: { $ref: '#/components/schemas/ConnectorState' }
                  history:
                    type: array
                    items: { $ref: '#/components/schemas/ConnectorCheck' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:

  securitySchemes:
    tenantKey:
      type: http
      scheme: bearer
      description: >-
        La clé API du tenant, détenue par le service de facturation — cette
        application ne la stocke jamais et délègue la vérification. Réservée aux
        appels de serveur à serveur.
    adminSession:
      type: apiKey
      in: cookie
      name: tfb_admin_session
      description: |
        JWT signé (HS256), posé par `POST /api/admin/auth/login`, `httpOnly`,
        `sameSite: lax`, `secure` en production, valable 8 heures.

        Toute route `/api/admin/*` est enveloppée par `withAdmin` : sans cookie
        valide, la réponse est `401` **avant** tout accès à la base.

  parameters:
    LicenseId:
      name: licenseId
      in: path
      required: true
      description: L'identifiant de licence du service de facturation, tel quel.
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      description: Entier positif. Toute autre valeur répond `400`.
      schema: { type: integer, minimum: 1 }

  responses:
    Ok:
      description: Opération effectuée.
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, const: true }
    BadRequest:
      description: Requête invalide.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentification requise.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Ressource introuvable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Trop de requêtes.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Secondes à attendre.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Service indisponible.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Message en français, destiné à être affiché tel quel.

    LocaleCode:
      type: string
      enum: [fr, en, nl, de, pl, uk, ru, ar]
      default: fr
      description: '`fr` est la locale par défaut et le repli de toutes les autres. `ar` est en écriture droite-à-gauche.'

    AdminRole:
      type: string
      enum: [superadmin, admin]

    EntityType:
      type: string
      enum: [ui, module, plan, brand, section, screenshot]
      description: '`ui` est la pseudo-entité d''`entityId` 0 qui porte la copy de châssis, sous des clés pointées (`hero.title`, `nav.modules`).'

    ReorderRequest:
      type: object
      required: [order]
      properties:
        order:
          type: array
          description: L'ordre complet, appliqué en une transaction.
          items:
            type: object
            required: [id, sortOrder]
            properties:
              id: { type: integer }
              sortOrder: { type: integer }

    PackKind:
      type: string
      enum: [subscription, one_time, addon, free]
      default: subscription
      description: Comment le pack est facturé — pas ce qu'il ouvre.

    Pack:
      type: object
      properties:
        id: { type: integer }
        key:
          type: string
          description: Égale au `code` du package côté service de facturation. Immuable.
        stripeProductId: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/PackKind' }
        icon: { type: [string, 'null'] }
        isActive: { type: boolean }
        isFeatured: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PackPrice:
      type: object
      properties:
        id: { type: integer }
        packId: { type: integer }
        stripePriceId: { type: string }
        amount: { type: [integer, 'null'], description: En centimes. `null` = sur devis. }
        currency: { type: string }
        interval: { type: string, enum: [month, year, one_time] }
        isDefault: { type: boolean }

    ModuleLabel:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        name: { type: string, description: Libellé français, ou la clé tant qu'aucune traduction n'existe. }
        icon: { type: [string, 'null'] }
        group: { type: [string, 'null'] }
        isActive: { type: boolean }

    PackView:
      allOf:
        - $ref: '#/components/schemas/Pack'
        - type: object
          properties:
            prices:
              type: array
              items: { $ref: '#/components/schemas/PackPrice' }
            modules:
              type: array
              items: { $ref: '#/components/schemas/ModuleLabel' }
            licenseCount: { type: integer }
            sellable:
              type: boolean
              description: Actif, et payable — produit et prix Stripe présents, sauf pour un pack `free`.

    ResolvedModule:
      type: object
      properties:
        moduleId: { type: integer }
        key: { type: string }
        open: { type: boolean }
        source:
          type: string
          enum: [pack, override, status]
          description: Qui a décidé — la composition du pack, une dérogation, ou le statut de la licence.
        reason: { type: string }
        overrideId: { type: integer }

    LicenseOverride:
      type: object
      properties:
        id: { type: integer }
        licenseId:
          type: string
          description: L'identifiant du service de facturation. Aucune clé étrangère ne traverse cette frontière, volontairement.
        moduleId: { type: integer }
        grant: { type: boolean }
        reason: { type: string }
        expiresAt: { type: [string, 'null'], format: date-time }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        revokedBy: { type: [string, 'null'] }

    EntitlementLicense:
      type: object
      properties:
        id: { type: string }
        store: { type: [string, 'null'] }
        package: { type: string }
        status: { type: string, description: Statut brut du service de facturation. Seuls `active` et `trialing` ouvrent. }
        open: { type: integer, description: Nombre de modules que cette licence ouvre. }

    ContactRequest:
      type: object
      required: [name, email, message]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 150 }
        company: { type: string, maxLength: 150 }
        message: { type: string, maxLength: 4000 }
        languageCode:
          $ref: '#/components/schemas/LocaleCode'
        website:
          type: string
          description: >-
            Honeypot. Un humain ne le remplit jamais. S'il est rempli, la route
            répond un succès et n'enregistre rien.

    Section:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        type: { type: string }
        brandId: { type: [integer, 'null'] }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        config: { type: [object, 'null'], additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Module:
      type: object
      properties:
        id: { type: integer }
        key: { type: string, description: Clé de jointure, immuable. }
        slug: { type: string }
        redirectUrl: { type: [string, 'null'] }
        repo: { type: [string, 'null'] }
        moduleGroup: { type: [string, 'null'] }
        icon: { type: [string, 'null'] }
        isActive: { type: boolean }
        isNew: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Screenshot:
      type: object
      properties:
        id: { type: integer }
        moduleId: { type: integer }
        filePath: { type: string, description: 'Chemin relatif, servi par `GET /api/storage/…`.' }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }

    Brand:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        logoPath: { type: [string, 'null'] }
        websiteUrl: { type: [string, 'null'] }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Plan:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        stripePriceId: { type: [string, 'null'] }
        amount: { type: [integer, 'null'], description: En centimes. `null` = sur devis. }
        currency: { type: string }
        interval: { type: string, enum: [month, year] }
        isActive: { type: boolean }
        isFeatured: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ContactMessage:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        company: { type: [string, 'null'] }
        message: { type: string }
        languageCode: { type: [string, 'null'] }
        status: { type: string, enum: [new, read, archived] }
        createdAt: { type: string, format: date-time }

    Subscription:
      type: object
      properties:
        id: { type: integer }
        brandId: { type: [integer, 'null'] }
        email: { type: string, format: email }
        stripeCustomerId: { type: [string, 'null'] }
        stripeSubscriptionId: { type: [string, 'null'] }
        planId: { type: integer }
        status:
          type: string
          description: Valeur Stripe brute (`active`, `past_due`, `canceled`…). Jamais traduite — c'est de la donnée.
        currentPeriodEnd: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        plan:
          type: object
          properties:
            key: { type: string }
            amount: { type: [integer, 'null'] }
            currency: { type: string }
        brand:
          type: [object, 'null']
          properties:
            name: { type: string }
            slug: { type: string }

    AdminLanguage:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        isRtl: { type: boolean }
        isDefault: { type: boolean }

    BillingActionResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        reason:
          type: string
          description: Présent quand `ok` est `false` — pourquoi l'action a été refusée.

    CheckoutResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [redirect, contact, stub] }
        url: { type: [string, 'null'], format: uri }
        reason: { type: string }
        planKey: { type: string }
        configured: { type: boolean, description: '`false` tant que les clés Stripe ne sont pas posées.' }

    # ---- Charge utile de la landing -----------------------------------------

    LandingLanguage:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        rtl: { type: boolean }

    LandingScreenshot:
      type: object
      properties:
        src: { type: [string, 'null'], description: URL publique, ou `null` tant qu'aucun fichier n'existe. }
        alt: { type: string }

    LandingFeature:
      type: object
      description: Une fonction documentée d'un module.
      properties:
        id: { type: integer }
        key: { type: string }
        icon: { type: string }
        name: { type: string }
        description: { type: string }
        screenshots:
          type: array
          items: { $ref: '#/components/schemas/LandingScreenshot' }

    LandingModule:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        slug: { type: string }
        icon: { type: string }
        group: { type: string, description: Libellé traduit du groupe. }
        groupKey: { type: string, description: Valeur brute — c'est elle que filtrent les puces, pas la traduction. }
        name: { type: string }
        description: { type: string }
        overview: { type: string }
        isNew: { type: boolean }
        redirectUrl: { type: [string, 'null'] }
        repo: { type: [string, 'null'] }
        screenshots:
          type: array
          items: { $ref: '#/components/schemas/LandingScreenshot' }
        features:
          type: array
          items: { $ref: '#/components/schemas/LandingFeature' }
        bullets:
          type: array
          items: { type: string }
        metric:
          type: array
          description: 'Le gain mesuré : `["12 min", "par inventaire"]`.'
          minItems: 2
          maxItems: 2
          items: { type: string }

    LandingPlan:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        features:
          type: array
          items: { type: string }
        priceLabel: { type: [string, 'null'], description: Formaté pour la locale, ou `null` pour « sur devis ». }
        amount: { type: [integer, 'null'] }
        currency: { type: string }
        interval: { type: string }
        featured: { type: boolean }
        stripePriceId: { type: [string, 'null'] }

    LandingSection:
      type: object
      properties:
        key: { type: string }
        type: { type: string }
        sortOrder: { type: integer }

    LandingBrand:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        logoPath: { type: [string, 'null'] }
        websiteUrl: { type: [string, 'null'] }

    LandingPayload:
      type: object
      required: [locale, dir, languages, sections, brands, modules, plans, strings]
      properties:
        locale: { type: string }
        dir: { type: string, enum: [ltr, rtl] }
        languages:
          type: array
          items: { $ref: '#/components/schemas/LandingLanguage' }
        sections:
          type: array
          description: Les sections actives, dans l'ordre. Le front rend celles-ci et rien d'autre.
          items: { $ref: '#/components/schemas/LandingSection' }
        brands:
          type: array
          items: { $ref: '#/components/schemas/LandingBrand' }
        modules:
          type: array
          items: { $ref: '#/components/schemas/LandingModule' }
        plans:
          type: array
          items: { $ref: '#/components/schemas/LandingPlan' }
        strings:
          type: object
          description: Chaînes `ui` résolues, indexées par clé pointée.
          additionalProperties: { type: string }

    Agent:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        kind: { type: string, enum: [commercial, technique] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }

    AgentRow:
      type: object
      description: Une ligne de la liste des agents.
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        kind: { type: string, enum: [commercial, technique] }
        isActive: { type: boolean }
        clients: { type: integer, description: Attributions ouvertes, tenants distincts. }
        planKeys:
          type: array
          items: { type: string }
        withoutPlan:
          type: integer
          description: >-
            Attributions ouvertes sans plan. Elles ne calculent rien, sans erreur
            ni zéro — nommées ici pour que ça se voie avant un versement.
        totalCents: { type: integer, description: Somme des commissions calculables, en centimes. }

    CommissionTier:
      type: object
      required: [fromMonth, percentBp]
      properties:
        fromMonth: { type: integer, minimum: 0, description: Ancienneté à partir de laquelle ce palier s'applique. 0 = première année. }
        percentBp:
          type: integer
          minimum: 0
          maximum: 10000
          description: Points de base. `9000` = 90,00 %. Jamais un flottant.

    CommissionPlan:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        label: { type: string }
        isActive: { type: boolean }
        tiers:
          type: array
          items: { $ref: '#/components/schemas/CommissionTier' }
        assignments: { type: integer }
        coversMonthZero:
          type: boolean
          description: '`false` = l''échelle démarre après le mois 0, donc rien n''est calculé pour un client neuf.'

    AgentAssignment:
      type: object
      properties:
        id: { type: integer }
        agentId: { type: integer }
        tenantSlug: { type: string }
        packKey: { type: [string, 'null'] }
        planId: { type: [integer, 'null'] }
        startedAt:
          type: string
          format: date-time
          description: >-
            L'ancienneté se compte depuis cette date, pas depuis la facture ni
            depuis l'arrivée du client.
        endedAt: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'] }

    Invoice:
      type: object
      description: >-
        Une facture telle que le service de facturation la publie. Cette
        application ne les modélise pas : elle les lit.
      properties:
        id: { type: string }
        tenant: { type: string, description: Le nom d'affichage du tenant, pas son slug. }
        store: { type: [string, 'null'] }
        stripe_invoice_id: { type: string }
        amount_due: { type: number }
        amount_paid: { type: number }
        currency: { type: string }
        status: { type: string, enum: [draft, open, paid, void, uncollectible] }
        period:
          type: string
          description: >-
            Texte d'affichage, pas une date. Une période illisible ne donne aucune
            commission et le dit — une date devinée est de l'argent faux.
        pdf: { type: boolean }

    CommissionReason:
      type: string
      description: Pourquoi une ligne vaut ce qu'elle vaut — ou pourquoi elle ne vaut rien.
      enum: [ok, unpaid, no_plan, empty_plan, no_tier, unparsable_period, outside_assignment]

    CommissionLine:
      type: object
      properties:
        invoiceId: { type: string }
        amount:
          type: [integer, 'null']
          description: >-
            En centimes. `null` dès que `reason` n'est pas `ok` — jamais `0`, qui
            se lirait comme une décision plutôt que comme une omission.
        percentBp: { type: [integer, 'null'] }
        months: { type: [integer, 'null'] }
        reason: { $ref: '#/components/schemas/CommissionReason' }
        tenantSlug: { type: string }
        packKey: { type: [string, 'null'] }
        invoice: { $ref: '#/components/schemas/Invoice' }

    AgentDetail:
      type: object
      properties:
        agent: { $ref: '#/components/schemas/Agent' }
        assignments:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              tenantSlug: { type: string }
              tenantName: { type: string }
              packKey: { type: [string, 'null'] }
              planKey: { type: [string, 'null'] }
              planLabel: { type: [string, 'null'] }
              tiers:
                type: array
                items: { $ref: '#/components/schemas/CommissionTier' }
              startedAt: { type: string, format: date-time }
              endedAt: { type: [string, 'null'], format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/CommissionLine' }
        totalCents: { type: integer }
        fixture: { type: boolean }
        settleable:
          type: boolean
          description: >-
            `false` tant que les factures ne viennent pas du service de
            facturation. Arrêter une commission sur des chiffres inventés, c'est
            payer sur une facture que personne n'a émise.

    CommercialCollection:
      type: string
      enum: [stages, services, billing-entities]

    CommercialSettings:
      type: object
      properties:
        stages:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              key: { type: string }
              label: { type: string }
              isActive: { type: boolean }
              sortOrder: { type: integer }
        services:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              key: { type: string }
              label: { type: string }
              amount: { type: [integer, 'null'], description: Centimes. `null` = sur devis. }
              currency: { type: string }
              isActive: { type: boolean }
              sortOrder: { type: integer }
        billingEntities:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              key: { type: string }
              name: { type: string }
              vatNumber: { type: [string, 'null'] }
              address: { type: [string, 'null'] }
              isDefault: { type: boolean }
              isActive: { type: boolean }

    ConnectorOutcome:
      type: string
      description: >-
        `unconfigured` est une décision, `down` un accident, `degraded` un
        connecteur qui répond avec une pièce en moins. Les confondre coûte soit une
        chasse à une panne inexistante, soit une vraie panne ignorée.
      enum: [ok, degraded, down, unconfigured]

    ConnectorCheckItem:
      type: object
      description: Un contrôle unitaire d'une sonde.
      properties:
        name: { type: string }
        outcome: { $ref: '#/components/schemas/ConnectorOutcome' }
        value:
          type: string
          description: >-
            Empreinte masquée, compteur ou statut court. **Jamais un secret, jamais
            une charge utile** — cette valeur s'affiche dans un navigateur, souvent
            pendant un partage d'écran.

    ConnectorState:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        what: { type: string }
        icon: { type: string, description: Nom de fichier dans public/icons. }
        env:
          type: array
          description: Les variables d'environnement concernées, nommées — jamais leurs valeurs.
          items: { type: string }
        breaks:
          type: string
          description: >-
            Ce qui s'arrête. Un voyant dit qu'un service est mort ; il ne dit pas
            qu'un client peut être débité sans qu'une ligne soit écrite.
        optional:
          type: boolean
          description: >-
            `true` quand l'absence est un état supporté — la console se dégrade et
            le dit. `false` quand l'application ne peut pas faire son travail.
        dependents:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              whenBroken: { type: string }
        outcome: { $ref: '#/components/schemas/ConnectorOutcome' }
        summary: { type: string }
        checks:
          type: array
          items: { $ref: '#/components/schemas/ConnectorCheckItem' }
        durationMs: { type: [integer, 'null'] }
        checkedAt: { type: string, format: date-time }

    ConnectorCheck:
      type: object
      description: Une ligne d'historique — tfb_connector_checks.
      properties:
        id: { type: integer }
        connector: { type: string }
        outcome: { $ref: '#/components/schemas/ConnectorOutcome' }
        detail:
          type: [string, 'null']
          description: Une ligne pour un humain. Ni charge utile, ni corps de réponse.
        durationMs: { type: [integer, 'null'] }
        trigger: { type: string, enum: [manual, page] }
        checkedAt: { type: string, format: date-time }
