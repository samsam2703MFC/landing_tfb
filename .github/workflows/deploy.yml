name: Déployer sur le serveur

# Le serveur héberge un clone de ce dépôt et un fichier infra/.env.
# Le déploiement se réduit donc à : mettre à jour le clone, reconstruire
# l'image de la landing, relancer la pile.
on:
  push:
    branches:
      - main
      - claude/landing-astro-directus
    paths-ignore:
      - '**.md'
      - 'examples/**'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Tous les prérequis sont contrôlés d'un coup : on veut connaître la
      # liste complète de ce qui bloque, pas la découvrir un run à la fois.
      - name: Vérifier les secrets et la clé SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          # Chemin du clone sur le serveur. Le secret l'emporte s'il existe ;
          # sinon on retombe sur l'emplacement en place. Ce n'est pas une
          # donnée sensible, juste un chemin de fichiers.
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/landing_tfb' }}
        run: |
          bloquant=0

          manquants=""
          [ -n "${SSH_HOST:-}" ]    || manquants="$manquants SSH_HOST"
          [ -n "${SSH_USER:-}" ]    || manquants="$manquants SSH_USER"
          [ -n "${SSH_KEY:-}" ]     || manquants="$manquants SSH_KEY"
          [ -n "${DEPLOY_PATH:-}" ] || manquants="$manquants DEPLOY_PATH"
          if [ -n "$manquants" ]; then
            echo "::error::Secrets absents ou vides :$manquants — les créer dans Paramètres → Secrets and variables → Actions."
            bloquant=1
          fi

          # La clé est écrite et testée même si un autre secret manque, pour
          # que le log liste tous les problèmes en une seule fois.
          if [ -n "${SSH_KEY:-}" ]; then
            mkdir -p ~/.ssh
            # `tr -d '\r'` : une clé copiée depuis Windows contient des CRLF
            # que libcrypto refuse de lire.
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy

            # Deuxième forme acceptée : la clé encodée en base64 (`base64 -w0`).
            # Les espaces et retours à la ligne éventuellement introduits par
            # un terminal sont retirés avant décodage, ce qui rend ce format
            # bien plus tolérant au copier-coller que le PEM multi-lignes.
            if ! grep -q -- '-----BEGIN' ~/.ssh/id_deploy \
               && tr -d ' \t\n' < ~/.ssh/id_deploy | base64 -d 2>/dev/null | grep -q -- '-----BEGIN'; then
              tr -d ' \t\n' < ~/.ssh/id_deploy | base64 -d > ~/.ssh/id_deploy.tmp
              mv ~/.ssh/id_deploy.tmp ~/.ssh/id_deploy
              chmod 600 ~/.ssh/id_deploy
              echo "Clé fournie en base64 : décodée."
            fi

            # Remise en forme des collages approximatifs : lignes vides en
            # tête, invite de terminal recopiée avant l'en-tête, texte ajouté
            # après le pied, ou clé aplatie sur une seule ligne.
            if grep -q -- '-----BEGIN' ~/.ssh/id_deploy; then
              sed -n '/-----BEGIN/,$p' ~/.ssh/id_deploy > ~/.ssh/id_deploy.tmp
              mv ~/.ssh/id_deploy.tmp ~/.ssh/id_deploy
            fi
            if grep -q -- '-----END' ~/.ssh/id_deploy; then
              sed -n '1,/-----END[A-Z0-9 -]*-----/p' ~/.ssh/id_deploy > ~/.ssh/id_deploy.tmp
              mv ~/.ssh/id_deploy.tmp ~/.ssh/id_deploy
            fi
            if [ "$(wc -l < ~/.ssh/id_deploy)" -le 1 ] && grep -q -- '-----BEGIN' ~/.ssh/id_deploy; then
              # Tout tient sur une ligne : on rétablit les sauts de ligne et on
              # replie le corps en base64 sur 70 colonnes, comme OpenSSH l'écrit.
              contenu=$(cat ~/.ssh/id_deploy)
              entete=$(printf '%s' "$contenu" | grep -o -- '-----BEGIN[A-Z0-9 -]*-----' | head -n 1)
              pied=$(printf '%s' "$contenu" | grep -o -- '-----END[A-Z0-9 -]*-----' | head -n 1)
              corps=$(printf '%s' "$contenu" | sed "s|$entete||; s|$pied||" | tr -d ' \t')
              { echo "$entete"; printf '%s' "$corps" | fold -w 70; echo; echo "$pied"; } > ~/.ssh/id_deploy
            fi
            chmod 600 ~/.ssh/id_deploy

            if ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
              echo "Clé SSH lue correctement ($(ssh-keygen -l -f ~/.ssh/id_deploy | awk '{print $1, $4}'))."
            else
              # On identifie la nature du contenu sans jamais l'afficher :
              # seul le verdict sort dans le log.
              lignes=$(wc -l < ~/.ssh/id_deploy)
              premiere=$(head -n 1 ~/.ssh/id_deploy)
              case "$premiere" in
                ssh-rsa*|ssh-ed25519*|ecdsa-sha2*|sk-ssh*)
                  diagnostic="c'est la clé PUBLIQUE. Copier le fichier sans l'extension .pub." ;;
                PuTTY-User-Key-File*)
                  diagnostic="c'est un fichier PuTTY (.ppk). Le convertir : puttygen cle.ppk -O private-openssh -o cle_openssh" ;;
                -----BEGIN*PRIVATE*KEY-----)
                  if ! grep -q -- '-----END' ~/.ssh/id_deploy; then
                    diagnostic="la clé est tronquée : la ligne « -----END … PRIVATE KEY----- » manque. Recopier le fichier en entier."
                  else
                    diagnostic="en-tête et pied présents (${lignes} lignes) mais la clé reste illisible : corps incomplet, ou clé protégée par une passphrase (le déploiement en exige une sans passphrase)."
                  fi ;;
                *)
                  diagnostic="aucune ligne « -----BEGIN … PRIVATE KEY----- » dans le secret (${lignes} ligne(s) au total). Le contenu collé n'est pas une clé privée." ;;
              esac
              echo "::error::Le secret SSH_KEY n'est pas une clé privée OpenSSH lisible : $diagnostic"
              bloquant=1
            fi
          fi

          [ "$bloquant" -eq 0 ] || exit 1

          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Mettre à jour et relancer la pile
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          # Chemin du clone sur le serveur. Le secret l'emporte s'il existe ;
          # sinon on retombe sur l'emplacement en place. Ce n'est pas une
          # donnée sensible, juste un chemin de fichiers.
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/landing_tfb' }}
          BRANCHE: ${{ github.ref_name }}
          DEPOT: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          # BatchMode + IdentitiesOnly : pas de repli sur le mot de passe, donc
          # un échec d'authentification reste lisible dans le log.
          # Le script distant est passé par l'entrée standard : les valeurs du
          # runner sont fixées en tête, le reste s'exécute côté serveur (d'où
          # les \$ échappés).
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" \
              -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" bash -s <<EOF
          set -euo pipefail
          DEPLOY_PATH='$DEPLOY_PATH'
          BRANCHE='$BRANCHE'
          DEPOT='$DEPOT'

          # Premier déploiement : le clone n'existe pas encore.
          if [ ! -d "\$DEPLOY_PATH/.git" ]; then
            echo "Clone initial dans \$DEPLOY_PATH"
            mkdir -p "\$(dirname "\$DEPLOY_PATH")"
            git clone "\$DEPOT" "\$DEPLOY_PATH"
          fi

          cd "\$DEPLOY_PATH"
          git fetch --prune origin
          git checkout "\$BRANCHE" 2>/dev/null || git checkout -b "\$BRANCHE" "origin/\$BRANCHE"
          git reset --hard "origin/\$BRANCHE"

          # Les identifiants ne peuvent pas venir du dépôt : ce fichier se crée
          # une fois à la main sur le serveur.
          if [ ! -f infra/.env ]; then
            echo "infra/.env absent dans \$DEPLOY_PATH. Le créer à partir de .env.example et y mettre les identifiants de la base et de Directus." >&2
            exit 1
          fi

          cd infra
          docker compose up -d --build
          docker image prune -f
          EOF

      - name: Vérifier que le site répond
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          if [ -z "${SITE_DOMAIN:-}" ]; then
            echo "SITE_DOMAIN non renseigné dans les variables du dépôt — vérification ignorée."
            exit 0
          fi
          for tentative in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$SITE_DOMAIN/" || echo 000)
            echo "tentative $tentative : HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Le site ne répond pas 200 après le déploiement." >&2
          exit 1

      - name: Effacer la clé
        if: always()
        run: rm -f ~/.ssh/id_deploy
