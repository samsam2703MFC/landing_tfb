name: Inspecter la base

# Lance l'inventaire de la base sur le serveur et l'affiche dans le journal.
# Uniquement des SELECT : rien n'est modifié.
on:
  workflow_dispatch:

jobs:
  inspecter:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer la connexion SSH
        uses: ./.github/actions/preparer-ssh
        with:
          cle: ${{ secrets.SSH_KEY }}
          hote: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}

      - name: Inventorier
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/landing_tfb' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" \
              -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" bash -s <<EOF
          set -euo pipefail
          RACINE='$DEPLOY_PATH'
          cd "\$RACINE"
          git fetch --prune origin
          git reset --hard "origin/${{ github.ref_name }}"
          set -a
          . ./infra/.env
          set +a
          node pipeline/inspect-db.mjs

          # Les captures de l'ancienne landing, si elles sont sur le disque.
          echo ""
          echo "──── fichiers de captures sur le serveur ────"
          for essai in /var/www/landing_tfb/storage /var/www/tfb-landing/storage /opt/landing-tfb/storage; do
            [ -d "\$essai" ] && echo "  \$essai :" && find "\$essai" -type f | head -20
          done
          find /var/www -maxdepth 4 -type d -name storage 2>/dev/null | head -5
          EOF

      - name: Effacer la clé
        if: always()
        run: rm -f ~/.ssh/id_deploy
