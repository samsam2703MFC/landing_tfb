name: CI

on:
  pull_request:
  push:
    branches: [main]

# Le déploiement dépend de ce workflow, donc il doit rester rapide et strict.
jobs:
  check:
    name: typecheck · lint · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Le client Prisma est généré à partir du schéma ; sans lui, tsc échoue
      # sur chaque import de @prisma/client.
      - run: npx prisma generate

      - run: npm run typecheck
      - run: npm run lint

      # Le build ne touche pas la base — aucun DATABASE_URL n'est nécessaire ici,
      # et c'est une propriété qu'on veut garder : si ce job se met à réclamer une
      # base, c'est qu'une page s'est mise à faire du prerender.
      - run: npm run build
        env:
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci
          ADMIN_SESSION_SECRET: ci-secret-32-characters-minimum-ok
