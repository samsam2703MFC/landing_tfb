name: Deploy

# Appelé par la CI une fois verte (job `deployer` de ci.yml), ou lancé à la main
# depuis l'onglet Actions.
#
# Ce workflow s'appuyait sur `workflow_run`. Il ne s'est jamais déclenché une
# seule fois, et la raison n'est pas dans ce fichier : GitHub ne lance un
# workflow `workflow_run` que depuis la version présente sur la BRANCHE PAR
# DÉFAUT du dépôt — or la branche par défaut est `feat/landing-and-back-office`,
# pas `main`. La CI, elle, part bien sur `main` parce qu'un `push:` utilise le
# fichier de la branche poussée.
#
# `workflow_call` n'a pas cette faiblesse : le workflow appelé est résolu depuis
# le commit de l'appelant. Le déploiement suit donc la CI quoi qu'il arrive à la
# branche par défaut.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  # Deux déploiements simultanés sur le même serveur se marcheraient dessus
  # (npm ci, migration, redémarrage). On sérialise, sans annuler celui en cours.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Vérifier que les secrets sont présents
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          KEY: ${{ secrets.SSH_KEY }}
        run: |
          missing=()
          [ -n "$HOST" ] || missing+=(SSH_HOST)
          [ -n "$USER" ] || missing+=(SSH_USER)
          [ -n "$KEY" ]  || missing+=(SSH_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Secrets manquants : ${missing[*]} — Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Préparer SSH
        env:
          KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Une clé illisible échoue plus loin en « Permission denied », ce qui
          # envoie chercher du côté des droits du serveur alors que le problème
          # est le format du secret. Panne observée les 02/08 et 05/08 :
          #   Load key "id_deploy": error in libcrypto
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            # La FORME du secret, jamais son contenu : nombre de lignes, taille,
            # en-tête. Aucune de ces valeurs n'est un secret, et elles suffisent à
            # distinguer les quatre façons de rater ce collage — ce que « clé
            # invalide » tout court ne dit pas.
            lignes=$(wc -l < ~/.ssh/id_deploy)
            octets=$(wc -c < ~/.ssh/id_deploy)
            case "$(head -1 ~/.ssh/id_deploy)" in
              '-----BEGIN OPENSSH PRIVATE KEY-----') forme='en-tête OpenSSH correct' ;;
              '-----BEGIN '*)                        forme='en-tête PEM mais pas OpenSSH' ;;
              ssh-*|ecdsa-*)                         forme='CLÉ PUBLIQUE collée à la place de la privée' ;;
              '')                                    forme='fichier vide' ;;
              *)                                     forme='aucun en-tête reconnu' ;;
            esac
            chiffree=non; if grep -q ENCRYPTED ~/.ssh/id_deploy; then chiffree=oui; fi
            crlf=non;     if grep -qU $'\r' ~/.ssh/id_deploy; then crlf=oui; fi

            echo "::error::SSH_KEY illisible — $forme ; $lignes ligne(s) ; $octets octets ; chiffrée : $chiffree ; retours CRLF : $crlf. Une clé ed25519 valide fait 7 lignes et ~400 octets. 0 ou 1 ligne = le collage a aplati la clé. « CLÉ PUBLIQUE » = c'est deploy_key.pub qui a été collé, pas deploy_key. chiffrée : oui = régénérer avec -N ''. Rappel : un secret défini sur l'environnement « production » masque celui du dépôt qui porte le même nom."
            exit 1
          fi

          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Sans empreinte épinglée, on fait confiance à la première réponse —
            # ce qui laisse la porte ouverte à un intercepteur. Épinglez-la :
            #   ssh-keyscan -p 22 VOTRE-HOTE
            # puis collez le résultat dans le secret SSH_KNOWN_HOSTS.
            echo "::warning::SSH_KNOWN_HOSTS absent — l'identité du serveur n'est pas vérifiée."
            ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Déployer
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT }}
          APP_DIR: ${{ vars.APP_DIR || '/srv/tfb-landing' }}
          APP_USER: ${{ vars.APP_USER || 'tfb' }}
        run: |
          # bash -s : le script tourne côté serveur, rien n'est écrit sur le runner.
          # set -euo pipefail à l'intérieur, pour qu'une étape ratée arrête la suite
          # au lieu de redémarrer le service sur un build incomplet.
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o BatchMode=yes "$USER@$HOST" \
              APP_DIR="$APP_DIR" APP_USER="$APP_USER" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"

          sudo -u "$APP_USER" git fetch origin main
          sudo -u "$APP_USER" git reset --hard origin/main
          sudo -u "$APP_USER" npm ci

          # Les secrets vivent sur le serveur, pas dans GitHub : le runner ne voit
          # jamais l'URL de la base.
          set -a; . /etc/tfb-landing.env; set +a
          sudo -u "$APP_USER" DATABASE_URL="$DATABASE_URL" npx prisma migrate deploy
          # Inlinée au build : sudo purge l'environnement, on la repasse.
          # --max-old-space-size : la machine a 1 Go de RAM. Sans borne, Node
          # grossit jusqu'à ce que le noyau le tue, et le service repart sur un
          # .next incomplet — panne observée le 02/08.
          sudo -u "$APP_USER" NEXT_PUBLIC_BASE_PATH="${NEXT_PUBLIC_BASE_PATH:-}" \
               NODE_OPTIONS=--max-old-space-size=1536 npm run build

          sudo systemctl restart tfb-landing
          REMOTE

      - name: Contrôler la santé
        env:
          # Le sous-chemin vient du serveur : une app servie sous
          # NEXT_PUBLIC_BASE_PATH ne répond pas à la racine, et le contrôle
          # échouerait sur un déploiement parfaitement réussi.
          HEALTH_PATH: ${{ vars.HEALTH_PATH || '/api/health' }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT }}
        run: |
          # Interrogé depuis le serveur : /api/health n'a pas besoin d'être public.
          for i in $(seq 1 20); do
            body=$(ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o BatchMode=yes "$USER@$HOST" \
                   "set -a; . /etc/tfb-landing.env 2>/dev/null; set +a; \
                    curl -fsS \"http://127.0.0.1:3000\${NEXT_PUBLIC_BASE_PATH:-}$HEALTH_PATH\"" 2>/dev/null || true)
            case "$body" in
              *'"db":"up"'*) echo "$body"; echo "::notice::Déploiement vérifié — l'app lit la base."; exit 0 ;;
            esac
            sleep 3
          done
          echo "::error::L'app ne répond pas ou ne joint pas la base. journalctl -u tfb-landing -n 50"
          exit 1

      - name: Nettoyer
        if: always()
        run: rm -f ~/.ssh/id_deploy
