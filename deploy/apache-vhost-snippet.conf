# Variante : les MÊMES directives, à coller DANS le <VirtualHost *:443> existant.
#
# À utiliser si le fichier conf-available/ ne prend pas effet — un vhost qui
# définit son propre ProxyPass, un RewriteRule, ou un Alias sur le chemin peut
# court-circuiter les directives globales.
#
#   sudo apache2ctl -S          # repère le fichier du vhost 443
#   sudo nano <ce-fichier>      # coller avant </VirtualHost>
#   sudo apache2ctl configtest && sudo systemctl reload apache2

    ProxyPreserveHost On
    ProxyPass        /landing_tfb  http://127.0.0.1:3000/landing_tfb
    ProxyPassReverse /landing_tfb  http://127.0.0.1:3000/landing_tfb
    ProxyTimeout 120

    <Location /landing_tfb>
        Require all granted
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port  "443"
    </Location>

    # Si le vhost porte un RewriteRule attrape-tout (typique d'une app PHP),
    # il faut l'exclure explicitement, sinon il gagne :
    #   RewriteCond %{REQUEST_URI} !^/landing_tfb
