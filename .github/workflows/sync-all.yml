name: Régénérer tous les modules

# Filet de sécurité : même si un dépôt oublie d'annoncer ses changements,
# la landing est resynchronisée chaque lundi matin. L'ingestion tourne sur
# le serveur, comme pour un module isolé.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Régénérer même les modules inchangés'
        required: false
        default: false
        type: boolean
      only:
        description: 'Limiter à certains slugs, séparés par des virgules (facultatif)'
        required: false
        type: string

# Un lot complet à la fois.
concurrency:
  group: sync-all
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer la connexion SSH
        uses: ./.github/actions/preparer-ssh
        with:
          cle: ${{ secrets.SSH_KEY }}
          hote: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}

      - name: Contrôler la liste des slugs
        id: filtre
        env:
          ONLY: ${{ inputs.only }}
        run: |
          # La valeur part vers un shell distant : slugs et virgules seulement.
          if [ -n "${ONLY:-}" ] && ! printf '%s' "$ONLY" | grep -qE '^[A-Za-z0-9_,-]+$'; then
            echo "::error::Liste de slugs invalide : $ONLY"
            exit 1
          fi
          echo "valeur=${ONLY:-}" >> "$GITHUB_OUTPUT"

      - name: Ingérer tous les modules sur le serveur
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/landing_tfb' }}
          FORCE: ${{ inputs.force }}
          ONLY: ${{ steps.filtre.outputs.valeur }}
        run: |
          set -euo pipefail
          ARGS=""
          [ "${FORCE:-}" = "true" ] && ARGS="--force"
          [ -n "${ONLY:-}" ] && ARGS="$ARGS --only=$ONLY"

          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" \
              -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" bash -s <<EOF
          set -euo pipefail
          cd '$DEPLOY_PATH/infra'
          docker compose --profile outils run --rm pipeline \
            node ingest-all.mjs $ARGS
          EOF

      - name: Effacer la clé
        if: always()
        run: rm -f ~/.ssh/id_deploy
