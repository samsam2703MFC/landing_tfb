name: Préparer la connexion SSH
description: >
  Écrit la clé de déploiement, la remet en forme si le collage l'a abîmée,
  vérifie qu'elle est lisible et enregistre l'empreinte du serveur.
  Utilisée par les trois workflows qui se connectent au serveur.

inputs:
  cle:
    description: Clé privée OpenSSH, ou son encodage base64
    required: true
  hote:
    description: Nom ou adresse du serveur
    required: true
  port:
    description: Port SSH
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SSH_KEY: ${{ inputs.cle }}
        SSH_HOST: ${{ inputs.hote }}
        SSH_PORT: ${{ inputs.port }}
      run: |
        set -uo pipefail

        manquants=""
        [ -n "${SSH_HOST:-}" ] || manquants="$manquants SSH_HOST"
        [ -n "${SSH_KEY:-}" ]  || manquants="$manquants SSH_KEY"
        if [ -n "$manquants" ]; then
          echo "::error::Secrets absents ou vides :$manquants — les créer dans Paramètres → Secrets and variables → Actions."
          exit 1
        fi

        mkdir -p ~/.ssh
        # `tr -d '\r'` : une clé copiée depuis Windows contient des CRLF que
        # libcrypto refuse de lire.
        printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy

        # Forme acceptée n°2 : la clé encodée en base64 (`base64 -w0`). Les
        # espaces et retours à la ligne ajoutés en route sont retirés avant
        # décodage, ce qui rend ce format bien plus tolérant au copier-coller.
        if ! grep -q -- '-----BEGIN' ~/.ssh/id_deploy \
           && tr -d ' \t\n' < ~/.ssh/id_deploy | base64 -d 2>/dev/null | grep -q -- '-----BEGIN'; then
          tr -d ' \t\n' < ~/.ssh/id_deploy | base64 -d > ~/.ssh/id_deploy.tmp
          mv ~/.ssh/id_deploy.tmp ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "Clé fournie en base64 : décodée."
        fi

        # Remise en forme des collages approximatifs : lignes vides en tête,
        # invite de terminal recopiée avant l'en-tête, texte ajouté après le
        # pied, ou clé aplatie sur une seule ligne.
        if grep -q -- '-----BEGIN' ~/.ssh/id_deploy; then
          sed -n '/-----BEGIN/,$p' ~/.ssh/id_deploy > ~/.ssh/id_deploy.tmp
          mv ~/.ssh/id_deploy.tmp ~/.ssh/id_deploy
        fi
        if grep -q -- '-----END' ~/.ssh/id_deploy; then
          sed -n '1,/-----END[A-Z0-9 -]*-----/p' ~/.ssh/id_deploy > ~/.ssh/id_deploy.tmp
          mv ~/.ssh/id_deploy.tmp ~/.ssh/id_deploy
        fi
        if [ "$(wc -l < ~/.ssh/id_deploy)" -le 1 ] && grep -q -- '-----BEGIN' ~/.ssh/id_deploy; then
          contenu=$(cat ~/.ssh/id_deploy)
          entete=$(printf '%s' "$contenu" | grep -o -- '-----BEGIN[A-Z0-9 -]*-----' | head -n 1)
          pied=$(printf '%s' "$contenu" | grep -o -- '-----END[A-Z0-9 -]*-----' | head -n 1)
          corps=$(printf '%s' "$contenu" | sed "s|$entete||; s|$pied||" | tr -d ' \t')
          { echo "$entete"; printf '%s' "$corps" | fold -w 70; echo; echo "$pied"; } > ~/.ssh/id_deploy
        fi
        chmod 600 ~/.ssh/id_deploy

        if ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
          echo "Clé SSH lue correctement ($(ssh-keygen -l -f ~/.ssh/id_deploy | awk '{print $1, $4}'))."
        else
          # On identifie la nature du contenu sans jamais l'afficher : seul le
          # verdict sort dans le log.
          lignes=$(wc -l < ~/.ssh/id_deploy)
          premiere=$(head -n 1 ~/.ssh/id_deploy)
          case "$premiere" in
            ssh-rsa*|ssh-ed25519*|ecdsa-sha2*|sk-ssh*)
              diagnostic="c'est la clé PUBLIQUE. Copier le fichier sans l'extension .pub." ;;
            PuTTY-User-Key-File*)
              diagnostic="c'est un fichier PuTTY (.ppk). Le convertir : puttygen cle.ppk -O private-openssh -o cle_openssh" ;;
            -----BEGIN*PRIVATE*KEY-----)
              if ! grep -q -- '-----END' ~/.ssh/id_deploy; then
                diagnostic="la clé est tronquée : la ligne « -----END … PRIVATE KEY----- » manque."
              else
                diagnostic="en-tête et pied présents (${lignes} lignes) mais la clé reste illisible : corps incomplet, ou clé protégée par une passphrase."
              fi ;;
            *)
              diagnostic="aucune ligne « -----BEGIN … PRIVATE KEY----- » dans le secret (${lignes} ligne(s)). Le contenu collé n'est pas une clé privée." ;;
          esac
          echo "::error::Le secret SSH_KEY n'est pas une clé privée OpenSSH lisible : $diagnostic"
          exit 1
        fi

        ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
