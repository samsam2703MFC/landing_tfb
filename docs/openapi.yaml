  /api/admin/billing/licenses/{licenseId}/block:
    post:
      tags: [Admin — Facturation]
      summary: Bloque une licence
      description: |
        Délègue au service de facturation, qui possède la licence : passage en
        `blocked`, écriture d'un `license_events` et d'une entrée de file de
        synchronisation.

        **Refusé (`409`) tant que `BILLING_SERVICE_URL` n'est pas défini** — pour
        que l'interface puisse en dire la raison, au lieu de laisser croire qu'un
        magasin a perdu son accès.
      operationId: blockLicense
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/billing/licenses/[id]/block/route.ts
      security: [{ adminSession: [] }]
      parameters:
        - name: licenseId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Licence bloquée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingActionResult' }
        '400':
          description: Identifiant manquant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingActionResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Action refusée — service de facturation non configuré ou en erreur.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingActionResult' }

  /api/admin/billing/sync/replay:
