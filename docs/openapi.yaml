  /api/admin/translations:
    get:
      tags: [Admin — Contenu]
      summary: Les traductions d'une entité, dans toutes les langues actives
      description: |
        Chaque champ est renvoyé pour **toutes** les locales actives, avec une
        chaîne vide là où rien n'existe — l'éditeur affiche ces cellules comme
        « Vide — fallback FR ».
      operationId: getTranslations
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/translations/route.ts
      security: [{ adminSession: [] }]
      parameters:
        - name: entityType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/EntityType' }
        - name: entityId
          in: query
          required: true
          description: '`0` pour la pseudo-entité `ui`, qui porte toute la copy de châssis.'
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Les champs et leurs valeurs par locale.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entityType: { $ref: '#/components/schemas/EntityType' }
                  entityId: { type: integer }
                  languages:
                    type: array
                    items: { $ref: '#/components/schemas/AdminLanguage' }
                  fields:
                    type: array
                    items:
                      type: object
                      properties:
                        field: { type: string }
                        values:
                          type: object
                          additionalProperties: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Admin — Contenu]
      summary: Écrit les traductions d'une entité
      description: |
        **Vider une cellule supprime la ligne** au lieu d'y stocker `''` : c'est
        l'absence de ligne qui déclenche le repli sur le français. Stocker une
        chaîne vide afficherait du vide sur la landing.
      operationId: putTranslations
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/translations/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityType, entityId, values]
              properties:
                entityType: { $ref: '#/components/schemas/EntityType' }
                entityId: { type: integer, minimum: 0 }
                values:
                  type: object
                  description: '`{ "<champ>": { "<locale>": "<texte>" } }`. Une valeur vide supprime la ligne.'
                  additionalProperties:
                    type: object
                    additionalProperties: { type: string }
      responses:
        '200':
          description: Écriture effectuée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  written: { type: integer }
                  cleared: { type: integer }
        '400':
          description: '`entityType` inconnu, `entityId` invalide, ou locale inconnue.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'

