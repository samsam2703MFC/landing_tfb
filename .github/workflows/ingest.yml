name: Ingérer un module

# L'ingestion tourne SUR LE SERVEUR, par SSH : la base n'est pas exposée
# sur Internet, et la clé Anthropic reste dans infra/.env.
#
# Deux déclencheurs :
#  - repository_dispatch « module-updated », envoyé par le dépôt d'un module
#    quand son code bouge (voir examples/module-publish.yml) ;
#  - lancement manuel depuis l'onglet Actions.
on:
  repository_dispatch:
    types: [module-updated]
  workflow_dispatch:
    inputs:
      module:
        description: "Slug ou dépôt (org/nom) tel qu'il figure dans modules.json"
        required: true
        type: string
      force:
        description: "Régénérer même si le dépôt n'a pas bougé"
        required: false
        default: false
        type: boolean

# Une ingestion à la fois par module ; on laisse finir celle qui tourne.
concurrency:
  group: ingest-${{ github.event.client_payload.repo || inputs.module || 'manuel' }}
  cancel-in-progress: false

jobs:
  ingerer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer la connexion SSH
        uses: ./.github/actions/preparer-ssh
        with:
          cle: ${{ secrets.SSH_KEY }}
          hote: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}

      - name: Déterminer la cible
        id: cible
        run: |
          CIBLE="${{ github.event.client_payload.repo || inputs.module }}"
          if [ -z "$CIBLE" ]; then
            echo "::error::Aucun module fourni."
            exit 1
          fi
          # Le nom part vers un shell distant : on refuse tout ce qui n'est pas
          # un slug ou un couple org/dépôt.
          if ! printf '%s' "$CIBLE" | grep -qE '^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)?$'; then
            echo "::error::Nom de module invalide : $CIBLE"
            exit 1
          fi
          echo "valeur=$CIBLE" >> "$GITHUB_OUTPUT"

      - name: Ingérer sur le serveur
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/landing_tfb' }}
          CIBLE: ${{ steps.cible.outputs.valeur }}
          FORCE: ${{ inputs.force || github.event.client_payload.force }}
        run: |
          set -euo pipefail
          ARGS=""
          [ "${FORCE:-}" = "true" ] && ARGS="--force"

          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" \
              -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" bash -s <<EOF
          set -euo pipefail
          cd '$DEPLOY_PATH/infra'
          docker compose --profile outils run --rm pipeline \
            node ingest.mjs '$CIBLE' $ARGS
          EOF

      - name: Effacer la clé
        if: always()
        run: rm -f ~/.ssh/id_deploy
