# Proxy Apache vers l'app Next, servie sous /landing_tfb.
#
# Ce fichier va dans conf-available/, PAS dans un vhost : les directives
# s'appliquent alors à tous les vhosts (80 et 443) sans qu'on touche à la
# configuration existante — dont celle qui sert phpMyAdmin.
#
#   sudo cp deploy/apache-landing_tfb.conf /etc/apache2/conf-available/landing_tfb.conf
#   sudo a2enmod proxy proxy_http headers
#   sudo a2enconf landing_tfb
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Pour retirer : sudo a2disconf landing_tfb && sudo systemctl reload apache2

ProxyRequests Off
ProxyPreserveHost On

# Pas de réécriture de chemin. L'app est buildée avec
# NEXT_PUBLIC_BASE_PATH=/landing_tfb, donc elle attend le chemin complet :
# les deux côtés portent le même préfixe.
ProxyPass        /landing_tfb  http://127.0.0.1:3000/landing_tfb
ProxyPassReverse /landing_tfb  http://127.0.0.1:3000/landing_tfb

# Uploads de screenshots : laisser le temps au transfert.
ProxyTimeout 120

<Location /landing_tfb>
    Require all granted

    # Next lit ces en-têtes pour savoir qu'il est derrière du TLS. Sans eux, il
    # se croit en HTTP et fabrique de mauvaises URLs absolues.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"
</Location>

# Le back office n'a rien à faire dans un index de moteur de recherche.
<Location /landing_tfb/admin>
    Header always set X-Robots-Tag "noindex, nofollow"
</Location>
