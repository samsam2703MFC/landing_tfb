# Pile de production : la landing Astro et Caddy en frontal.
#
# La base de données n'est PAS gérée ici : on se branche sur le SQL existant
# (PostgreSQL ou MySQL selon DB_CLIENT), où le pipeline écrit directement les
# tables tfb_modules, tfb_fonctions et tfb_site.
#
# Les variables viennent du fichier .env placé à côté de ce compose.

name: landing-tfb

services:
  web:
    build:
      context: ../apps/web
      args:
        SITE_DOMAIN: ${SITE_DOMAIN}
    restart: unless-stopped
    environment:
      # Lecture du contenu en base, côté serveur uniquement : les identifiants
      # restent dans le conteneur et ne partent jamais vers le navigateur.
      DB_CLIENT: ${DB_CLIENT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_LOGIN: ${DB_LOGIN}
      DB_NAME: ${DB_NAME}
      DB_PASS: ${DB_PASS}
      SITE_DOMAIN: ${SITE_DOMAIN}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-60000}
      HOST: 0.0.0.0
      PORT: 4321
    extra_hosts:
      # Permet d'atteindre une base installée sur l'hôte (DB_HOST=host.docker.internal).
      - "host.docker.internal:host-gateway"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Ports par défaut volontairement décalés : un serveur web occupe
      # souvent déjà 80 et 443. Mettre HTTP_PORT=80 et HTTPS_PORT=443 dans
      # .env dès qu'un domaine est configuré, pour l'HTTPS automatique.
      - "${HTTP_PORT:-8090}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Outil ponctuel, jamais démarré avec la pile (profil « outils ») :
  #   docker compose --profile outils run --rm pipeline node bootstrap-db.mjs
  #   docker compose --profile outils run --rm pipeline node ingest-all.mjs
  pipeline:
    profiles: ["outils"]
    build:
      context: ../pipeline
    environment:
      DB_CLIENT: ${DB_CLIENT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_LOGIN: ${DB_LOGIN}
      DB_NAME: ${DB_NAME}
      DB_PASS: ${DB_PASS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      GH_INGEST_TOKEN: ${GH_INGEST_TOKEN}
    volumes:
      # Le code vit dans /app/pipeline ; modules.json est lu un cran au-dessus.
      # On le monte plutôt que de le copier : ajouter un module ne demande
      # alors pas de reconstruire l'image.
      - ../modules.json:/app/modules.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  caddy_data:
  caddy_config:
