name: Déployer sur le serveur

# Le serveur héberge un clone de ce dépôt et un fichier infra/.env.
# Le déploiement se réduit donc à : mettre à jour le clone, reconstruire
# l'image de la landing, relancer la pile.
on:
  push:
    branches:
      - main
      - claude/landing-astro-directus
    paths-ignore:
      - '**.md'
      - 'examples/**'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer la connexion SSH
        uses: ./.github/actions/preparer-ssh
        with:
          cle: ${{ secrets.SSH_KEY }}
          hote: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}

      - name: Mettre à jour et relancer la pile
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          # Chemin du clone sur le serveur. Le secret l'emporte s'il existe ;
          # sinon on retombe sur l'emplacement en place. Ce n'est pas une
          # donnée sensible, juste un chemin de fichiers.
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/landing_tfb' }}
          BRANCHE: ${{ github.ref_name }}
          DEPOT: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          # Le script distant est passé par l'entrée standard : les valeurs du
          # runner sont fixées en tête, le reste s'exécute côté serveur (d'où
          # les \$ échappés).
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" \
              -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" bash -s <<EOF
          set -euo pipefail
          DEPLOY_PATH='$DEPLOY_PATH'
          BRANCHE='$BRANCHE'
          DEPOT='$DEPOT'

          # Premier déploiement : le clone n'existe pas encore.
          if [ ! -d "\$DEPLOY_PATH/.git" ]; then
            echo "Clone initial dans \$DEPLOY_PATH"
            mkdir -p "\$(dirname "\$DEPLOY_PATH")"
            git clone "\$DEPOT" "\$DEPLOY_PATH"
          fi

          cd "\$DEPLOY_PATH"
          git fetch --prune origin
          git checkout "\$BRANCHE" 2>/dev/null || git checkout -b "\$BRANCHE" "origin/\$BRANCHE"
          git reset --hard "origin/\$BRANCHE"

          # Les identifiants ne peuvent pas venir du dépôt. On dépose le
          # gabarit au premier passage, mais il reste à le remplir à la main.
          if [ ! -f infra/.env ]; then
            cp .env.example infra/.env
            echo "infra/.env vient d'être créé dans \$DEPLOY_PATH à partir de .env.example. Renseigner les valeurs puis relancer le déploiement." >&2
            exit 1
          fi

          # On ne contrôle que les variables encore présentes dans le gabarit :
          # un .env hérité d'une version précédente peut contenir des clés
          # abandonnées, sans que cela empêche la pile de démarrer.
          restants=''
          absentes=''
          for cle in \$(grep -E '^[A-Z_]+=' .env.example | cut -d= -f1); do
            ligne=\$(grep -E "^\$cle=" infra/.env | head -n 1 || true)
            if [ -z "\$ligne" ]; then
              absentes="\$absentes \$cle"
            elif printf '%s' "\$ligne" | grep -q 'change-moi'; then
              restants="\$restants \$cle"
            fi
          done

          if [ -n "\$absentes" ]; then
            echo "Variables absentes de \$DEPLOY_PATH/infra/.env :\$absentes" >&2
            echo "Le gabarit a évolué. Repartir de zéro : cp .env.example infra/.env puis le remplir." >&2
            exit 1
          fi
          if [ -n "\$restants" ]; then
            echo "Valeurs encore à renseigner dans \$DEPLOY_PATH/infra/.env :\$restants" >&2
            exit 1
          fi

          cd infra
          docker compose up -d --build

          # Les tables sont créées à chaque déploiement : le script ne crée que
          # ce qui manque, donc une évolution du schéma est appliquée toute
          # seule sans jamais toucher aux données existantes.
          docker compose --profile outils run --rm --build pipeline node bootstrap-db.mjs

          # Contenu de départ : uniquement si la base est vide. Un déploiement
          # ne doit pas écraser ce que l'ingestion a généré depuis.
          docker compose --profile outils run --rm pipeline node seed-contenu.mjs --si-vide

          docker image prune -f
          EOF

      - name: Vérifier que le site répond
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          if [ -z "${SITE_DOMAIN:-}" ]; then
            echo "SITE_DOMAIN non renseigné dans les variables du dépôt — vérification ignorée."
            exit 0
          fi
          for tentative in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$SITE_DOMAIN/" || echo 000)
            echo "tentative $tentative : HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Le site ne répond pas 200 après le déploiement." >&2
          exit 1

      - name: Effacer la clé
        if: always()
        run: rm -f ~/.ssh/id_deploy
