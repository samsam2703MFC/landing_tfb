          multipart/form-data:
            schema:
              type: object
              required: [file, category]
              properties:
                file: { type: string, format: binary }
                category: { type: string, enum: [screenshots, brands] }
      responses:
        '201':
          description: Fichier écrit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string, examples: ['/storage/brands/logo-a1b2c3.png'] }
                  size: { type: integer }
        '400':
          description: Requête non multipart, catégorie inconnue, ou aucun fichier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Type non autorisé, ou fichier de plus de 4 Mo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/contact-messages:
    get:
