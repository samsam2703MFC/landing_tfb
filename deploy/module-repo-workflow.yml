# Le fichier à déposer dans CHAQUE dépôt de module, en
# .github/workflows/notify-landing.yml
#
# Il ne fait qu'une chose : prévenir la landing que la fiche du module a changé.
# La landing s'occupe du reste — lire le manifeste, écrire les traductions,
# photographier les écrans.
#
# Un secret à créer dans le dépôt (Settings → Secrets and variables → Actions) :
#
#   TFB_LANDING_TOKEN   un jeton d'accès personnel à portée fine, avec la seule
#                       permission « Contents: read and write » sur
#                       samsam2703MFC/landing_tfb. Rien d'autre. Un jeton
#                       classique à portée « repo » donnerait à quinze dépôts
#                       un accès en écriture à tout le compte.
#
# Sans ce fichier, le module est quand même publié — mais à 6 h 15 le lendemain,
# par la tournée programmée. Ceci ne fait que raccourcir l'attente.

name: Notifier la landing

on:
  push:
    branches: [master, main]
    paths:
      # Uniquement quand la fiche change. Un commit de code ne redéclenche pas
      # une ingestion : le contenu de la landing n'en dépend pas.
      - 'tfb-module.json'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher l'ingestion
        env:
          TOKEN: ${{ secrets.TFB_LANDING_TOKEN }}
          LANDING: samsam2703MFC/landing_tfb
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::TFB_LANDING_TOKEN absent — la landing ne sera pas prévenue."
            exit 1
          fi

          code=$(curl -sS -o /tmp/reponse.json -w '%{http_code}' \
            -X POST "https://api.github.com/repos/$LANDING/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$(jq -nc --arg r "$GITHUB_REPOSITORY" \
                  '{event_type:"module-updated", client_payload:{repo:$r}}')")

          # 204 est la réponse normale : accepté, sans contenu.
          if [ "$code" != "204" ]; then
            echo "::error::La landing a répondu $code"
            cat /tmp/reponse.json
            exit 1
          fi
          echo "::notice::Ingestion demandée pour $GITHUB_REPOSITORY"
