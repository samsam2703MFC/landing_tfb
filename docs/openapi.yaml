openapi: 3.1.0

# Contrat d'API de la landing TFB et de son back-office.
#
# Ce fichier décrit UNIQUEMENT ce qui est implémenté dans src/app/api. Chaque
# opération porte `x-tfb-status: implemented` et le fichier source dont elle est
# tirée. Rien n'y est anticipé : un endpoint absent d'ici n'existe pas.
#
# Ce que ce fichier ne couvre pas encore, et qu'il ne faut donc pas croire absent
# de l'application — cinq routes d'administration de la configuration par tenant :
#   /api/admin/app-config/{tenant}            et /publish
#   /api/admin/catalogue/sources              et /{name}
#   /api/admin/catalogue/proposals
# Le manifest par marque et la session PWA, eux, n'existent nulle part.

info:
  title: TFB — Landing & Back Office API
  version: 1.0.0
  description: |
    Deux surfaces dans une même application Next.js.

    **API publique** — ce que consomme la landing : le contenu résolu dans une
    langue, les locales actives, le formulaire de contact, le paiement.

    **API admin** (`/api/admin/*`) — protégée par `withAdmin`, gérée par un cookie
    de session signé. Toute route admin non authentifiée répond `401`, avant tout
    accès à la base.

    Deux règles traversent le modèle :

    - **Aucune copy en dur.** Toute chaîne affichée vient de `tfb_translations`.
      Le français est la locale de repli : une traduction absente retombe sur FR,
      et vider une cellule **supprime** la ligne plutôt que d'y stocker `''`.
    - **Aucun média en base.** Les fichiers vont dans `STORAGE_PATH` ; la base ne
      garde que le chemin relatif (`/storage/screenshots/x.png`), servi par
      `GET /api/storage/…`.
  contact:
    name: The Franchise Buddy

servers:
  - url: http://localhost:3000
    description: Développement
  - url: https://{host}
    description: Production
    variables:
      host:
        default: www.franchisebuddy.eu

tags:
  - name: Landing
    description: API publique consommée par le site vitrine.
  - name: Paiement
    description: Stripe. Bouchonné tant que les clés ne sont pas configurées.
  - name: Fichiers
    description: Service des fichiers téléversés.
  - name: Admin — Authentification
  - name: Admin — Contenu
    description: Sections, modules, captures, enseignes, plans, traductions.
  - name: Admin — Facturation
    description: Lecture des abonnements, actions déléguées au service de facturation.
  - name: Admin — Packs & licences
    description: >-
      Les packs (produits Stripe), ce qu'ils ouvrent, et les dérogations par
      licence. À ne pas confondre avec `/api/admin/billing/*`, qui délègue au
      service de facturation : ces routes-ci sont les nôtres.

security: []

paths:
  # ------------------------------------------------------------------ public --

  /api/landing:
    get:
      tags: [Landing]
      summary: Le contenu complet de la landing, résolu dans une langue
      description: |
        Tout ce que la landing affiche, en un appel : sections actives, enseignes,
        modules avec leurs captures et leurs fonctions, plans, et les chaînes `ui`.

        Le repli est déjà appliqué : chaque champ est renvoyé dans la langue
        demandée, ou en français quand la traduction n'existe pas.
      operationId: getLanding
      x-tfb-status: implemented
      x-tfb-source: src/app/api/landing/route.ts
      parameters:
        - name: lang
          in: query
          required: false
          description: Code locale. Une valeur inconnue retombe sur `fr`, sans erreur.
          schema:
            $ref: '#/components/schemas/LocaleCode'
      responses:
        '200':
          description: Le contenu résolu.
          headers:
            Cache-Control:
              schema: { type: string }
              description: '`public, s-maxage=60, stale-while-revalidate=300`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandingPayload' }
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/languages:
    get:
      tags: [Landing]
      summary: Les locales actives
      operationId: getLanguages
      x-tfb-status: implemented
      x-tfb-source: src/app/api/languages/route.ts
      responses:
        '200':
          description: Les locales actives, dans leur ordre d'affichage.
          content:
            application/json:
              schema:
                type: object
                required: [languages]
                properties:
                  languages:
                    type: array
                    items: { $ref: '#/components/schemas/LandingLanguage' }
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/contact:
    post:
      tags: [Landing]
      summary: Enregistre un message du formulaire de contact
      description: |
        Deux protections anti-spam, toutes deux silencieuses côté client :

        - **Honeypot** — le champ `website` n'est jamais rempli par un humain.
          S'il l'est, la route répond `200 { ok: true }` et **n'enregistre rien**.
          Un bot voit un succès et cesse de réessayer.
        - **Limite par IP** — 5 messages par tranche de 10 minutes, puis `429`.
      operationId: postContact
      x-tfb-status: implemented
      x-tfb-source: src/app/api/contact/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactRequest' }
      responses:
        '200':
          description: Honeypot déclenché. Rien n'a été enregistré.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
        '201':
          description: Message enregistré.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: Champs manquants ou e-mail invalide.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  fields:
                    type: object
                    additionalProperties: { type: string }
                    description: Message d'erreur par champ fautif.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/checkout:
    post:
      tags: [Paiement]
      summary: Ouvre une session Stripe Checkout pour un plan
      description: |
        Trois issues, toutes en `200` — c'est voulu : l'interface doit pouvoir dire
        la vérité au lieu de simuler une redirection.

        - `status: "redirect"` — session créée, `url` à suivre.
        - `status: "contact"` — plan « sur devis » (`amount` NULL). Ces plans vont
          au formulaire de contact, jamais à Checkout.
        - `status: "stub"` — Stripe non configuré, ou `stripe_price_id` vide.
          `reason` dit lequel des deux.
      operationId: postCheckout
      x-tfb-status: implemented
      x-tfb-source: src/app/api/checkout/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planKey]
              properties:
                planKey:
                  type: string
                  description: '`tfb_plans.key`. Le plan doit être actif.'
                email:
                  type: string
                  format: email
                  description: Pré-remplit Checkout. Facultatif.
      responses:
        '200':
          description: Issue du paiement — voir `status`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Plan inconnu ou inactif.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/stripe/webhook:
    post:
      tags: [Paiement]
      summary: Webhook Stripe — tient `tfb_subscriptions` à jour
      description: |
        La signature est vérifiée avant toute écriture. Tant que
        `STRIPE_WEBHOOK_SECRET` n'est pas défini, **la route refuse tout appel** :
        un webhook non vérifié ne doit jamais écrire en base.
      operationId: postStripeWebhook
      x-tfb-status: implemented
      x-tfb-source: src/app/api/stripe/webhook/route.ts
      requestBody:
        required: true
        description: Charge utile Stripe brute. Le corps est lu tel quel pour la vérification de signature.
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Événement traité, ou ignoré parce que non pertinent.
        '400':
          description: Signature invalide, ou secret de webhook absent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/billing/portal:
    get:
      tags: [Paiement]
      summary: Lien vers le portail client Stripe
      description: |
        Session admin obligatoire : le portail expose l'historique de facturation
        d'un tiers, il n'est pas public.
      operationId: getBillingPortal
      x-tfb-status: implemented
      x-tfb-source: src/app/api/billing/portal/route.ts
      security:
        - adminSession: []
      parameters:
        - name: subscription
          in: query
          required: true
          description: '`tfb_subscriptions.stripe_subscription_id`.'
          schema: { type: string }
      responses:
        '200':
          description: Lien du portail, ou bouchon si Stripe n'est pas configuré.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [redirect, stub] }
                  url: { type: [string, 'null'], format: uri }
                  reason: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Aucun `stripe_customer_id` pour cet abonnement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/health:
    get:
      tags: [Landing]
      summary: L'application répond-elle, et parle-t-elle vraiment à la base
      description: >-
        La première chose à interroger après un déploiement — c'est ce que fait
        `deploy.yml`, depuis le serveur.


        Volontairement avare : la route est publique, donc elle rapporte
        l'accessibilité et si le seed a tourné, jamais un détail de schéma, une
        version ou un contenu de ligne. Elle exécute une vraie requête et pas un
        simple test de connexion : un serveur joignable au schéma manquant reste un
        déploiement cassé.
      operationId: getHealth
      x-tfb-status: implemented
      x-tfb-source: src/app/api/health/route.ts
      responses:
        '200':
          description: L'application lit la base.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  db: { type: string, const: up }
                  seeded: { type: boolean, description: '`false` tant que le seed n''a pas tourné.' }
        '503':
          description: La base est injoignable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: false }
                  db: { type: string, const: down }

  /api/app-config:
    get:
      tags: [Landing]
      summary: Tout ce que la PWA d'un tenant lit au démarrage
      description: >-
        Thème, navigation, drapeaux de fonctionnalité et codes de package auxquels
        le tenant a droit. Un endpoint, une dimension de plus — la même forme que
        `GET /api/landing` a déjà pour `lang`.


        Cette charge utile est de la configuration de présentation, pas de la donnée
        client, donc elle est servie par slug. Les lignes réelles passent par
        `/api/data/{resource}`, qui refuse d'identifier un tenant depuis la chaîne
        de requête.


        `draft=1` sert ce que la console est en train d'éditer et exige une session
        admin, pour qu'un profil à moitié fini se prévisualise sans être publié.
      operationId: getAppConfig
      x-tfb-status: implemented
      x-tfb-source: src/app/api/app-config/route.ts
      parameters:
        - name: tenant
          in: query
          required: true
          schema: { type: string }
        - name: draft
          in: query
          required: false
          description: '`1` sert le brouillon. Exige une session back-office.'
          schema: { type: string, enum: ['1'] }
        - name: If-None-Match
          in: header
          required: false
          description: L'`etag` déjà détenu. Une PWA à jour ne doit pas retélécharger sa configuration.
          schema: { type: string }
      responses:
        '200':
          description: La configuration résolue.
          headers:
            ETag: { schema: { type: string } }
            Cache-Control:
              schema: { type: string }
              description: Un brouillon est `private, no-store` — il est par administrateur et ne doit jamais atterrir dans un cache partagé.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '304':
          description: Déjà à jour.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Le brouillon exige une session back-office.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/app-config/schema:
    get:
      tags: [Landing]
      summary: Le registre des variables et les clés du catalogue
      description: >-
        Ce qui rend le back-office générique : il construit son formulaire à partir
        de cette réponse au lieu de coder un écran par variable.


        Public et cacheable — il décrit la forme de la configuration, jamais les
        valeurs d'un tenant.
      operationId: getAppConfigSchema
      x-tfb-status: implemented
      x-tfb-source: src/app/api/app-config/schema/route.ts
      responses:
        '200':
          description: Le registre et le catalogue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  variables: { type: array, items: { type: object, additionalProperties: true } }
                  resources: { type: array, items: { type: object, additionalProperties: true } }

  /api/data/{resource}:
    get:
      tags: [Landing]
      summary: Une ressource du catalogue, pour la PWA d'un tenant
      description: >-
        Un seul gestionnaire pour tout le catalogue : ajouter une ressource est une
        entrée dans `catalogue.ts`, jamais un nouveau fichier de route.


        **Sur l'authentification, à lire avant de brancher une PWA.** Le tenant
        n'est jamais identifié qu'au serveur. Cette version le résout depuis une
        session back-office, parce que l'application n'a pas encore
        d'authentification côté tenant. Faire confiance à `?tenant=` venant d'un
        appelant anonyme est exactement ainsi qu'un client finit par lire les lignes
        d'un autre : un appel non authentifié est donc refusé.
      operationId: getDataResource
      x-tfb-status: implemented
      x-tfb-source: src/app/api/data/[resource]/route.ts
      parameters:
        - name: resource
          in: path
          required: true
          schema: { type: string }
        - name: tenant
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: La ressource.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Authentification tenant requise.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------- admin --

  /api/admin/auth/login:
    post:
      tags: [Admin — Authentification]
      summary: Ouvre une session back-office
      description: |
        Authentifie contre `tfb_admin_users` et pose le cookie de session.

        La réponse d'échec est **identique** pour « compte inconnu » et « mot de
        passe faux », avec un temps de traitement comparable : la route ne doit pas
        servir à énumérer les comptes.

        Limite : 10 tentatives par IP et par quart d'heure.
      operationId: adminLogin
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/auth/login/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Session ouverte. Le cookie `tfb_admin_session` est posé (httpOnly, 8 h).
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  email: { type: string }
                  role: { $ref: '#/components/schemas/AdminRole' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: E-mail ou mot de passe incorrect.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: E-mail ou mot de passe manquant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Admin — Authentification]
      summary: Ferme la session
      operationId: adminLogout
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/auth/login/route.ts
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/admin/sections:
    get:
      tags: [Admin — Contenu]
      summary: Toutes les sections de la landing
      operationId: listSections
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/sections/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Les sections, par `sortOrder`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sections:
                    type: array
                    items: { $ref: '#/components/schemas/Section' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Admin — Contenu]
      summary: Crée une section
      description: Créée **inactive** — une section ne peut pas apparaître avant que ses traductions existent.
      operationId: createSection
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/sections/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, type]
              properties:
                key: { type: string, maxLength: 80 }
                type: { type: string, maxLength: 50 }
                sortOrder: { type: integer, default: 0 }
                config:
                  type: object
                  additionalProperties: true
                  description: Paramètres d'affichage uniquement. Jamais de copy.
      responses:
        '201':
          description: Section créée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  section: { $ref: '#/components/schemas/Section' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Admin — Contenu]
      summary: Réordonne les sections
      description: Un seul ordre complet, appliqué en une transaction — un réordonnancement à moitié appliqué afficherait la landing dans une séquence que personne n'a choisie.
      operationId: reorderSections
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/sections/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderRequest' }
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/sections/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Admin — Contenu]
      summary: Modifie une section
      operationId: updateSection
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/sections/[id]/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive: { type: boolean }
                type: { type: string }
                sortOrder: { type: integer }
                config: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Section modifiée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  section: { $ref: '#/components/schemas/Section' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin — Contenu]
      summary: Supprime une section et ses traductions
      operationId: deleteSection
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/sections/[id]/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/modules:
    get:
      tags: [Admin — Contenu]
      summary: Les modules et leur nombre de captures
      operationId: listModules
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/modules/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Les modules, par `sortOrder`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  modules:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Module'
                        - type: object
                          properties:
                            screenshotCount: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Admin — Contenu]
      summary: Crée un module
      description: |
        C'est aussi l'endpoint qu'appelle la routine de veille quand elle détecte
        un nouveau produit.

        Le module est créé **inactif** (`isActive: false`) : invisible sur la
        landing tant que ses traductions ne sont pas écrites et qu'un humain ne
        l'a pas publié.

        `key` est la clé de jointure — celle sur laquelle s'alignent la sync et
        toutes les traductions. Elle ne se renomme pas.
      operationId: createModule
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/modules/route.ts
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, maxLength: 80 }
                slug: { type: string, maxLength: 120, description: 'Défaut : la valeur de `key`.' }
                icon: { type: string, maxLength: 60, default: layers, description: Nom de fichier d'icône dans `public/icons`. }
                moduleGroup: { type: string, maxLength: 80 }
                repo: { type: string, maxLength: 150 }
                redirectUrl: { type: string, maxLength: 255, description: 'Défaut : `/modules/<slug>`.' }
                sortOrder: { type: integer, default: 0 }
      responses:
        '201':
          description: Module créé, inactif.
          content:
            application/json:
              schema:
                type: object
                properties:
                  module: { $ref: '#/components/schemas/Module' }
        '400':
          description: '`key` manquante, ou `key`/`slug` déjà pris.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/modules/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Admin — Contenu]
      summary: Un module et ses captures ordonnées
      operationId: getModule
      x-tfb-status: implemented
      x-tfb-source: src/app/api/admin/modules/[id]/route.ts
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Le module.
          content:
            application/json:
              schema:
